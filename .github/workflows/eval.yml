name: LLM Regression Eval

on:
  pull_request:
    paths:
      - 'prompts/**'

jobs:
  eval:
    name: Run LLM Regression Eval
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for baseline resolution

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Eval Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          python -m src.eval_runner

      - name: Post PR Comment with Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'runs', 'latest_result.json');
            
            if (fs.existsSync(resultPath)) {
              const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
              
              let statusEmoji = '✅';
              if (result.status === 'warn') {
                statusEmoji = '⚠️';
              } else if (result.status === 'fail') {
                statusEmoji = '🔴';
              }
              
              const body = `### 📊 LLM Regression Eval Results
              
              - **Status**: ${statusEmoji} **${result.status.toUpperCase()}**
              - **Accuracy**: ${(result.accuracy * 100).toFixed(2)}% (Delta: ${result.accuracy_delta >= 0 ? '+' : ''}${result.accuracy_delta}%)
              - **Regressions**: ${result.regressions_count}
              - **Improvements**: ${result.improvements_count}
              - **Run ID**: \`${result.run_id}\`
              
              *The detailed HTML diff report is available in the workflow run artifacts.*`;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              console.log("No latest_result.json found. Skipping comment.");
            }

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: reports/
